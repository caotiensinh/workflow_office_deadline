name: Hybrid Workflow CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect critical regression suites against accidental deletion
        run: |
          PYTHONPATH=python python - <<'PY'
          import pathlib, unittest
          required = [
              'tests/test_hybrid.py',
              'tests/test_intake_w2.py',
              'tests/test_delivery_integrity.py',
              'tests/test_approval_w3.py',
              'tests/test_desktop_w4.py',
              'tests/test_ui_w5.py',
              'tests/test_field_uat_launcher_w8.py',
              'tests/test_schedule_w9.py',
              'tests/test_regulation_w10.py',
              'tests/test_hr_evidence_w11.py',
              'tests/test_monitoring_w12.py',
              'tests/test_staging_w13.py',
              'tests/test_task_xml_w14.py',
              'tests/test_portable_w15.py',
              'tests/test_session_w16.py',
              'tests/test_uat_review_w17.py',
              'tests/test_kit_integrity_w18.py',
              'tests/test_active_console_w19.py',
              'tests/test_persisted_uat_review_w20a.py',
              'tests/test_uat_packet_w21a.py',
              'tests/test_task_plan_w21b.py',
              'tests/test_packaged_uat_review_w22a.py',
              'tests/test_scheduler_cadence_w22b.py',
              'tests/test_outlook_readiness_w22c.py',
              'tests/test_operator_handoff_w23b.py',
              'windows/w23_hosted_task_live_smoke.ps1',
              '.github/workflows/w23a-hosted-task-synthetic.yml',
              'windows/w24_hosted_automatic_cadence.ps1',
              '.github/workflows/w24a-real-automatic-hosted.yml',
              'windows/w24_hosted_startup_roundtrip.ps1',
              '.github/workflows/w24b-hosted-startup-roundtrip.yml',
              'python/edu_workflow/uat_pair_w25a.py',
              'tests/test_uat_pair_w25a.py',
              'windows/w25_live_task_readonly_audit.ps1',
              '.github/workflows/w25b-hosted-task-readonly-audit.yml',
          ]
          missing = [name for name in required if not pathlib.Path(name).is_file()]
          if missing:
              raise SystemExit(f'Missing safety regression suites: {missing}')
          count = unittest.defaultTestLoader.discover('tests').countTestCases()
          if count < 379:
              raise SystemExit(f'Safety test regression: expected at least 379 cases, found {count}')
          print(f'Regression test manifest PASS ({count} tests)')
          PY
      - name: W5 real Tk widgets in isolated virtual X display
        run: |
          command -v xvfb-run
          PYTHONPATH=python xvfb-run -a python tests/w5_real_tk_smoke.py
      - run: PYTHONPATH=python python -m unittest discover -s tests -v
  rust-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --manifest-path rust-core/Cargo.toml --verbose
      - run: cargo build --manifest-path rust-core/Cargo.toml --release
      - run: PYTHONPATH=python python -m edu_workflow.cli --db /tmp/edu-github-demo.sqlite import-json --file examples/cases.json
      - run: PYTHONPATH=python python -m edu_workflow.cli --db /tmp/edu-github-demo.sqlite tick --backend rust --rust-bin rust-core/target/release/edu_rules --at 2026-10-19T09:00:00+09:00
      - run: PYTHONPATH=python python -m edu_workflow.cli --db /tmp/edu-github-demo.sqlite alerts
