name: W30 GitHub Actions Bot PR Permission Acceptance

on:
  push:
    branches:
      - main
      - feat/w30-github-actions-pr-real-acceptance

permissions:
  contents: read

jobs:
  hosted-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove branch never writes or opens a PR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          y = Path(".github/workflows/w30-actions-pr-permission-acceptance.yml").read_text()
          assert "vars.EDU_AUTOPILOT_DOC_PR_LIVE == 'true'" in y
          assert "github.ref == 'refs/heads/main'" in y
          assert "pull-requests: write" in y
          assert "git push origin --delete" in y
          assert "gh pr create" in y
          assert ("gh pr " + "merge") not in y
          assert ("git push origin " + "main") not in y
          assert "ACTIONS_PR_PERMISSION_E2E.md" in y
          assert not Path("docs/autopilot-proposals/ACTIONS_PR_PERMISSION_E2E.md").exists()
          print("W30_HOSTED_READONLY_ACCEPTANCE_WORKFLOW_POLICY_PASS")
          PY

  one-time-real-bot-pr:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'caotiensinh/workflow_office_deadline' && vars.EDU_AUTOPILOT_DOC_PR_LIVE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    concurrency:
      group: edu-w30-once-bot-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Actually create a one-file review-required PR using GITHUB_TOKEN
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = caotiensinh/workflow_office_deadline
          test "$GITHUB_REF" = refs/heads/main
          path="docs/autopilot-proposals/ACTIONS_PR_PERMISSION_E2E.md"
          title="Autopilot W30: GitHub Actions permission E2E (review required)"
          if [ -e "$path" ]; then
            echo W30_ALREADY_IN_MAIN_SKIP
            exit 0
          fi
          known="$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --json title --jq '.[].title')"
          if grep -Fqx -- "$title" <<< "$known"; then
            echo W30_PRIOR_ACCEPTANCE_PR_FOUND_SKIP
            exit 0
          fi
          test -z "$(git status --porcelain)"
          test -d docs/autopilot-proposals
          umask 077
          cat > "$path" <<'EOF'
          <!-- W30_GITHUB_ACTIONS_AUTONOMOUS_PR_PERMISSION_PROOF -->
          # W30 GitHub Actions PR permission smoke

          This fictional-only document was generated automatically by a
          GitHub-hosted workflow to verify review-required PR creation.

          No Ollama inference, independent AI agent, company resource,
          workplace email, production task, human approval or auto-merge
          is part of this smoke. The document is intentionally inert.
          EOF
          git add -- "$path"
          staged="$(git diff --cached --name-only)"
          test "$staged" = "$path"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --check
          branch="autopilot/w30-actions-permission-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "docs(autopilot): one-time GITHUB_TOKEN PR permission acceptance"
          gh auth setup-git
          git push origin "$branch"
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "$title" \
            --body "W30 one-time GitHub Actions PR permission E2E. Generated by the GitHub-hosted workflow using GITHUB_TOKEN. Exact one-file synthetic documentation change. Requires human review and explicit CI check before merge. Never auto-merge; not evidence of AI model inference or production acceptance."; then
            git push origin --delete "$branch" || true
            echo W30_BOT_PR_PERMISSION_STILL_BLOCKED_BRANCH_CLEANUP_ATTEMPTED
            exit 4
          fi
          echo W30_GITHUB_ACTIONS_BOT_CREATED_REAL_REVIEW_PR_NO_AUTO_MERGE
