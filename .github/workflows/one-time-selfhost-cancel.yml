name: Cancel only stalled synthetic self-hosted test

on:
  push:
    branches:
      - test/unstick-selfhost-20261019

permissions:
  contents: read

jobs:
  cancel-specific-run:
    if: github.repository == 'caotiensinh/workflow_office_deadline'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Cancel only self-host test 39269944734; do not restart runner machine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/39269944734/cancel"
          echo "CANCEL_REQUESTED_FOR_39269944734"
