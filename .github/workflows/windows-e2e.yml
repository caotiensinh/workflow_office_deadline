name: Windows Synthetic E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  windows-rust-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test native Rust engine
        run: |
          cargo test --manifest-path rust-core/Cargo.toml
          cargo build --release --manifest-path rust-core/Cargo.toml
      - name: Import synthetic cases and invoke actual PowerShell runner twice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $PWD 'python'
          $db = Join-Path $env:RUNNER_TEMP 'workflow-demo.sqlite'
          $out = Join-Path $env:RUNNER_TEMP 'workflow-notifications'
          python -m edu_workflow.cli --db $db import-json --file examples/cases.json
          if ($LASTEXITCODE -ne 0) { throw 'sample import failed' }
          & .\windows\run_once.ps1 -DbPath $db -OutDir $out -At '2026-10-19T09:00:00+09:00'
          if ($LASTEXITCODE -ne 0) { throw 'first run failed' }
          & .\windows\run_once.ps1 -DbPath $db -OutDir $out -At '2026-10-19T09:00:00+09:00'
          if ($LASTEXITCODE -ne 0) { throw 'second run failed' }
          @'
          import json, pathlib, sqlite3, os
          db=pathlib.Path(os.environ['RUNNER_TEMP'])/'workflow-demo.sqlite'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'workflow-notifications'
          conn=sqlite3.connect(db)
          assert conn.execute('SELECT COUNT(*) FROM cases').fetchone()[0] == 5
          assert conn.execute("SELECT COUNT(*) FROM alerts WHERE state='SENT'").fetchone()[0] == 6
          assert len(list(out.glob('*.json'))) == 6
          for path in out.glob('*.json'):
              body=json.loads(path.read_text(encoding='utf-8'))
              assert body['id'] == path.stem
          print('Windows native E2E PASS: 5 cases; 6 durable notices; second run idempotent')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Windows E2E assertion failed' }
      - name: W9 WF06 native Windows read-only schedule proposal acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $PWD 'python'
          python -m unittest discover -s tests -p test_schedule_w9.py -v
          if ($LASTEXITCODE -ne 0) { throw 'W9 Windows schedule regression failed' }
          $unusedDb = Join-Path $env:RUNNER_TEMP 'w9-proposal-must-not-create.sqlite3'
          if (Test-Path -LiteralPath $unusedDb) { throw 'W9 isolated DB fixture already exists' }
          $report = (python -m edu_workflow.cli --db $unusedDb schedule-propose --file examples/wf06_availability.json) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $report.status -ne 'PROPOSALS' -or
              $report.proposals.Count -ne 2 -or -not $report.requires_human_approval -or
              $report.calendar_verified -or $report.external_actions_performed -or
              $report.writes_database) {
            throw 'W9 Windows read-only schedule result invalid'
          }
          if (Test-Path -LiteralPath $unusedDb) { throw 'W9 schedule illegally created a database' }
          Write-Host 'W9_WF06_WINDOWS_OFFLINE_PROPOSAL_PASS_NO_DB_NO_INVITES'
      - name: W12 Windows read-only monitor dashboard and UNKNOWN quarantine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $PWD 'python'
          python -m unittest discover -s tests -p test_monitoring_w12.py -v
          if ($LASTEXITCODE -ne 0) { throw 'W12 monitoring regression tests failed' }
          $env:W12_TEST_DB = Join-Path $env:RUNNER_TEMP 'w12-monitor-synthetic.sqlite'
          $reportHtml = Join-Path $env:RUNNER_TEMP 'w12-monitor-report.html'
          if (Test-Path -LiteralPath $env:W12_TEST_DB) { throw 'W12 synthetic database already exists' }
          if (Test-Path -LiteralPath $reportHtml) { throw 'W12 synthetic report already exists' }
          @'
          import os
          from edu_workflow.store import open_store,add_case
          db=open_store(os.environ["W12_TEST_DB"])
          add_case(db,{
            "case_id":"W12-CI-FAKE","kind":"EMAIL","data_class":"RESTRICTED",
            "safe_title":"PRIVATE_CI_ONLY","owner":"fictional@example.invalid",
            "status":"IN_PROGRESS","approval_status":"NOT_REQUIRED",
            "due_at":"2026-10-22T17:00:00+09:00","due_verified":True,"evidence_ref":None
          })
          with db:
            db.execute("INSERT INTO alerts(alert_id,case_id,revision,code,severity,day,message,state,created_at) VALUES(?,?,?,?,?,?,?,?,?)",
                       ("a"*64,"W12-CI-FAKE",1,"DUE","HIGH","2026-10-20","PRIVATE_CI_ONLY","UNKNOWN","2026-10-20T05:00:00+00:00"))
          db.close()
          print("W12_SYNTHETIC_DB_CREATED_FOR_CI_ONLY")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'W12 synthetic setup failed' }
          $json = @(python -m edu_workflow.cli --db $env:W12_TEST_DB monitor --at '2026-10-20T15:00:00+09:00')
          $rc = $LASTEXITCODE
          $report = ([string]::Join([Environment]::NewLine, $json)) | ConvertFrom-Json
          if ($rc -ne 3 -or $report.status -ne 'CRITICAL' -or
              $report.counts.UNKNOWN -ne 1 -or $report.messages_resent -or
              $report.database_created -or $report.external_actions_performed -or
              $report.production_accepted -or $report.incidents[0].code -ne 'UNKNOWN_DELIVERY') {
            throw 'W12 monitoring should isolate UNKNOWN without resend or side effects'
          }
          $saved = @(python -m edu_workflow.cli --db $env:W12_TEST_DB monitor --at '2026-10-20T15:00:00+09:00' --format html --output $reportHtml)
          $htmlRc = $LASTEXITCODE
          $summary = ([string]::Join([Environment]::NewLine, $saved)) | ConvertFrom-Json
          if ($htmlRc -ne 3 -or $summary.status -ne 'CRITICAL' -or
              -not (Test-Path -LiteralPath $reportHtml -PathType Leaf)) {
            throw 'W12 HTML generation failed'
          }
          $content = Get-Content -LiteralPath $reportHtml -Raw -Encoding UTF8
          if ($content -match 'PRIVATE_CI_ONLY|fictional@example.invalid|<script|https?://' -or
              $content -notmatch 'UNKNOWN') {
            throw 'W12 HTML output contains PII or external links'
          }
          @'
          import os, sqlite3
          conn=sqlite3.connect(os.environ["W12_TEST_DB"])
          assert conn.execute("SELECT state FROM alerts").fetchone()[0]=="UNKNOWN"
          assert conn.execute("SELECT COUNT(*) FROM decisions").fetchone()[0]==0
          print("W12_MONITOR_STATES_UNCHANGED")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'W12 monitor changed database' }
          Write-Host 'W12_WINDOWS_READONLY_MONITOR_PASS_UNKNOWN_NO_RETRY_NO_PII'
          $global:LASTEXITCODE = 0
      - name: W11 Windows anonymous HR evidence draft and manual-decision guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $PWD 'python'
          python -m unittest discover -s tests -p test_hr_evidence_w11.py -v
          if ($LASTEXITCODE -ne 0) { throw 'W11 HR safety regressions failed' }
          $db = Join-Path $env:RUNNER_TEMP 'W11_NEVER_CREATE.sqlite'
          if (Test-Path -LiteralPath $db) { throw 'W11 isolated output DB already exists' }
          $source = Join-Path $PWD 'examples\wf05_synthetic_source.txt'
          $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '469039e8e9b952c786333f298148b9a573371e6f761f60e6f3c208607774c73a') {
            throw 'W11 synthetic evidence bytes changed (check Git line endings)'
          }
          $raw = @(python -m edu_workflow.cli --db $db hr-draft --packet-file examples/wf05_hr_packet.json --as-of 2026-10-20)
          $rc = $LASTEXITCODE
          $report = ($raw -join "`n") | ConvertFrom-Json
          if ($rc -ne 0 -or $report.status -ne 'READY_FOR_HUMAN_REVIEW' -or
              $report.draft_sections.Count -ne 2 -or -not $report.human_review_required -or
              $report.hr_assessment_performed -or $report.ranking_performed -or
              $report.employment_decision_performed -or $report.external_actions_performed -or
              $report.writes_database -or $report.source_authenticity_verified) {
            throw 'W11 HR draft must stay source-cited, review-only and side-effect-free'
          }
          if (Test-Path -LiteralPath $db) { throw 'W11 HR preview illegally created SQLite DB' }
          Write-Host 'W11_WINDOWS_ANONYMOUS_HR_DRAFT_PASS_REVIEW_ONLY_NO_DB'
      - name: W10 Windows regulation provenance E2E, no automated legal decision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $PWD 'python'
          python -m unittest discover -s tests -p test_regulation_w10.py -v
          if ($LASTEXITCODE -ne 0) { throw 'W10 regulation safety tests failed' }
          $db = Join-Path $env:RUNNER_TEMP 'W10_MUST_NOT_EXIST.sqlite'
          if (Test-Path -LiteralPath $db) { throw 'W10 isolated DB fixture already exists' }
          $registry = Join-Path $PWD 'examples\wf04_regulation_registry.json'
          $doc = Join-Path $PWD 'examples\wf04_synthetic_reference.txt'
          $digest = (Get-FileHash -LiteralPath $doc -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "W10_FIXTURE_DOCUMENT_SHA256=$digest"
          if ($digest -ne 'd9e01a94a80e8489b02a32634446bfc55120521c09c8eb42f55d2ddd4eef8e3e') {
            throw 'Fixture bytes were changed on Windows checkout (line endings or file corruption)'
          }
          $raw = @(python -m edu_workflow.cli --db $db check-regulations --registry-file $registry --reference SYN-REG-001@V1 --as-of 2026-10-20)
          $returnCode = $LASTEXITCODE
          $report = ($raw -join "`n") | ConvertFrom-Json
          Write-Host "W10_SOURCE_STATUS=$($report.status) reason=$($report.reason) rc=$returnCode"
          if ($returnCode -ne 0 -or $report.status -ne 'SOURCE_SNAPSHOT_PASS' -or
              $report.official_authenticity_verified -or $report.legal_applicability_verified -or
              -not $report.human_decision_required -or $report.external_actions_performed) {
            throw 'W10 verification may not claim a legal conclusion or side effect'
          }
          $old = (python -m edu_workflow.cli --db $db check-regulations --registry-file $registry --reference SYN-REG-001@V0 --as-of 2026-10-20) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 3 -or $old.reason -ne 'SUPERSEDED_REFERENCE') {
            throw 'W10 stale regulation should be blocked'
          }
          if (Test-Path -LiteralPath $db) { throw 'W10 read-only source check created a workflow database' }
          Write-Host 'W10_WINDOWS_SOURCE_PROVENANCE_PASS_NO_LEGAL_APPROVAL_NO_DB'
          # The superseded V0 check intentionally returned exit code 3.
          # Reset only AFTER verifying the expected reason and no local writes.
          $global:LASTEXITCODE = 0
      - name: W2 actual Windows EML intake and Rust deadline E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $PWD 'python'
          python -m unittest discover -s tests -p test_intake_w2.py -v
          if ($LASTEXITCODE -ne 0) { throw 'W2 intake tests failed' }
          $db = Join-Path $env:RUNNER_TEMP 'w2-inbox.sqlite'
          $out = Join-Path $env:RUNNER_TEMP 'w2-notifications'
          $eml = Join-Path $PWD 'examples\w2_inbox'
          & .\windows\run_once.ps1 -DbPath $db -OutDir $out -ImportEmlDir $eml -At '2026-10-19T09:00:00+09:00'
          if ($LASTEXITCODE -ne 0) { throw 'W2 initial run failed' }
          & .\windows\run_once.ps1 -DbPath $db -OutDir $out -ImportEmlDir $eml -At '2026-10-19T09:00:00+09:00'
          if ($LASTEXITCODE -ne 0) { throw 'W2 repeated run failed' }
          @'
          import json, os, pathlib, sqlite3
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          db = sqlite3.connect(root / "w2-inbox.sqlite")
          db.row_factory = sqlite3.Row
          cases = [json.loads(x["payload"]) for x in db.execute("SELECT payload FROM cases")]
          assert len(cases) == 3, cases
          assert all(c["kind"] == "EMAIL" and c["status"] == "TRIAGE" for c in cases)
          assert sum(bool(c["due_at"]) for c in cases) == 1, cases
          assert all(c["due_verified"] is False for c in cases)
          assert db.execute("SELECT COUNT(*) FROM alerts WHERE state='SENT'").fetchone()[0] == 3
          assert db.execute("SELECT COUNT(*) FROM alerts").fetchone()[0] == 3
          notices = list((root/"w2-notifications").glob("*.json"))
          assert len(notices) == 3
          print("W2 E2E PASS: 3 private-safe cases, 3 notifications, 0 duplicates on rerun")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'W2 Windows E2E acceptance failed' }
      - name: W2b safely preview scheduled EML and Outlook intake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $PWD 'examples\w2_inbox'
          $json = & .\windows\install_task.ps1 -PlanOnly -ImportEmlDir $source
          $plan = $json | ConvertFrom-Json
          if ($plan.source -ne 'eml' -or $plan.interval_minutes -ne 15) { throw 'invalid EML task plan' }
          if (-not $plan.command.Contains('-ImportEmlDir')) { throw 'EML intake not scheduled' }
          if ($plan.notification_channel -ne 'file' -or $plan.replaces_existing) { throw 'unsafe defaults' }
          $outlook = (& .\windows\install_task.ps1 -PlanOnly -ImportOutlookClassic) | ConvertFrom-Json
          if ($outlook.source -ne 'outlook-classic') { throw 'Outlook option not planned' }
          if (-not $outlook.command.Contains('-ImportOutlookClassic')) { throw 'Outlook argument missing' }
          $caught = $false
          try {
            & .\windows\install_task.ps1 -PlanOnly -ImportOutlookClassic -ImportEmlDir $source
          } catch {
            $caught = $true
          }
          if (-not $caught) { throw 'conflicting source arguments accepted' }
          Write-Host 'W2b Task Scheduler command preview PASS; no task registration performed'
      - name: W3 human gate, Rust reminder and approval audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $PWD 'python'
          @'
          import getpass,json,os,pathlib,subprocess,sys
          from edu_workflow.store import open_store,get_cases,get_case,audit_list
          root=pathlib.Path.cwd()
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          inbox=tmp/'w2-inbox.sqlite'
          demo=tmp/'workflow-demo.sqlite'
          env=dict(os.environ,EDU_VERIFIER_USERS=getpass.getuser(),EDU_APPROVER_USERS=getpass.getuser())
          def cli(db,*args,typed=''):
              return subprocess.run([sys.executable,'-m','edu_workflow.cli','--db',str(db),*args],
                                    input=typed,capture_output=True,text=True,env=env,cwd=root)
          con=open_store(inbox)
          try:
              case,rev=next((c,r) for c,r in get_cases(con) if c.get('due_at'))
              assert rev==1 and not case['due_verified']
              cid=case['case_id']; due=case['due_at']
          finally: con.close()
          queue=cli(inbox,'review-queue')
          assert queue.returncode==0,queue.stderr
          pending=json.loads(queue.stdout)
          assert len(pending)==3 and all('VERIFY_DEADLINE' in r['reasons'] for r in pending)
          args=('confirm-deadline','--case-id',cid,'--due',due,'--revision','1','--method','source-reviewed')
          wrong=cli(inbox,*args,typed='CONFIRM WRONG\n')
          assert wrong.returncode==2
          good=cli(inbox,*args,typed=f'CONFIRM {cid} {due}\n')
          assert good.returncode==0,good.stderr
          assert json.loads(good.stdout)['revision']==2
          assert cli(inbox,*args,typed=f'CONFIRM {cid} {due}\n').returncode==2
          binary=root/'rust-core'/'target'/'release'/'edu_rules.exe'
          tick=cli(inbox,'tick','--backend','rust','--rust-bin',str(binary),
                   '--at','2026-10-19T09:00:00+09:00')
          assert tick.returncode==0,tick.stderr
          assert json.loads(tick.stdout)['alerts_added']==1,tick.stdout
          con=open_store(inbox)
          try:
              events=[dict(r) for r in con.execute('SELECT code,state FROM alerts WHERE case_id=?',(cid,))]
              assert any(e['code']=='D_MINUS_3' and e['state']=='QUEUED' for e in events),events
              assert len([x for x in audit_list(con) if x['case_id']==cid and x['event']=='HUMAN_VERIFIED_DEADLINE'])==1
          finally: con.close()
          approval=cli(demo,'decide','--case-id','EDU-002','--revision','1',
                       '--decision','approve',typed='APPROVE EDU-002\n')
          assert approval.returncode==0,approval.stderr
          con=open_store(demo)
          try:
              case,rev=get_case(con,'EDU-002')
              assert (case['status'],rev)==('APPROVED',2)
              assert con.execute('SELECT count(*) FROM decisions WHERE case_id=?',('EDU-002',)).fetchone()[0]==1
              assert any(x['event']=='HUMAN_APPROVED' and x['case_id']=='EDU-002' for x in audit_list(con))
          finally: con.close()
          print('W3 E2E PASS: human confirmation, Rust D-3, atomic decision and audit')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'W3 approval E2E failed' }
