name: W5 Windows Desktop Package & User-Session Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-package:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: W5 Tk controller regression and user-session protection
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONPATH = Join-Path $PWD 'python'
          python -m unittest discover -s tests -p test_ui_w5.py -v
          if ($LASTEXITCODE -ne 0) { throw 'W5 UI-controller regressions failed' }
          python -m unittest discover -s tests -p test_desktop_w4.py -v
          if ($LASTEXITCODE -ne 0) { throw 'W4 notification regressions failed' }
      - name: W7 synthetic field UAT plan-only proof (no GUI or machine mutation)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONPATH = Join-Path $PWD 'python'
          $p = (python -m edu_workflow.field_uat --plan-only) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $p.mode -ne 'plan-only' -or
              -not $p.synthetic_only -or $p.changes_startup -or $p.production_accepted) {
            throw 'Unsafe W7 manual-UAT default mode'
          }
      - name: W5B real Windows Tk widget E2E with synthetic SQLite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $PWD 'python'
          $report = Join-Path $env:RUNNER_TEMP 'w5b-windows-tk-e2e.json'
          python tests/w5_windows_tk_widget_e2e.py --report $report
          if ($LASTEXITCODE -ne 0) { throw 'W5B real Windows Tk widgets E2E failed' }
          if (!(Test-Path -LiteralPath $report)) { throw 'W5B GUI evidence missing' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'PASS_WINDOWS_TK_WIDGET_E2E' -or
              -not $result.gui_window_mapped -or $result.approvals -ne 0 -or
              $result.initial_bell_calls -ne 1 -or
              -not $result.snooze_expiry_realerted -or
              -not $result.realert_only_once) {
            throw 'W5B Windows GUI E2E did not actually pass'
          }
          Write-Host "W5B_WINDOWS_TK_E2E_PASS session=$($result.windows_session_id)"
      - uses: actions/upload-artifact@v4
        with:
          name: W5B-Windows-Tk-Synthetic-Proof
          path: ${{ runner.temp }}/w5b-windows-tk-e2e.json
          if-no-files-found: error
          retention-days: 7
      - name: Package self-contained Windows desktop app
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install "pyinstaller>=6.12,<7"
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller dependency setup failed' }
          & .\windows\build_desktop.ps1 -Python 'python'
          # PowerShell scripts throw on failure; $LASTEXITCODE only tracks native programs.
          # Validate generated binary below instead of trusting a stale exit code.
          $exe = Join-Path $PWD 'dist\EDUNotifications.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Desktop EXE missing' }
          $preflight = Join-Path $env:RUNNER_TEMP 'w5-bundle-smoke.json'
          & $exe --db (Join-Path $env:RUNNER_TEMP 'w5-synthetic.sqlite3') --preflight-file $preflight
          if ($LASTEXITCODE -ne 0) { throw 'Portable Windows EXE preflight failed' }
          # A --windowed EXE can return before its GUI subprocess flushes its file.
          # Poll only this synthetic preflight path; never inspect the user's desktop.
          for ($i=0; $i -lt 40 -and !(Test-Path -LiteralPath $preflight -PathType Leaf); $i++) {
            Start-Sleep -Milliseconds 250
          }
          if (!(Test-Path -LiteralPath $preflight -PathType Leaf)) { throw 'Windowed EXE did not write smoke proof within 10 seconds' }
          $p=Get-Content -LiteralPath $preflight -Raw | ConvertFrom-Json
          if ($p.packaged_entrypoint -ne 'OK' -or -not $p.tk_importable) {
            throw 'The one-file EXE cannot import Tkinter'
          }
          Write-Host "W5_WINDOWS_EXE_SHA256=$((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash)"
      - name: Test safe Startup-folder preview, isolated install, rollback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe = Join-Path $PWD 'dist\EDUNotifications.exe'
          $db = Join-Path $env:RUNNER_TEMP 'w5-placeholder.sqlite3'
          $dir = Join-Path $env:RUNNER_TEMP 'w5-startup-sandbox'
          New-Item -ItemType File -Force -Path $db | Out-Null
          $p = (& .\windows\manage_desktop_startup.ps1 -PlanOnly -Executable $exe -DbPath $db -TestStartupDir $dir) | ConvertFrom-Json
          if ($p.action -ne 'preview' -or $p.modifies_registry -or $p.modifies_task_scheduler -or $p.requires_admin) {
            throw 'Unsafe or incorrect startup preview'
          }
          & .\windows\manage_desktop_startup.ps1 -Install -Executable $exe -DbPath $db -TestStartupDir $dir
          # No $LASTEXITCODE here: install is a PowerShell script and throws on failure.
          # Verify the created link and its target instead.
          $file = Join-Path $dir 'EDU_Workflow_Notifications.lnk'
          if (!(Test-Path -LiteralPath $file)) { throw 'Expected W5 shortcut missing' }
          $sh = New-Object -ComObject WScript.Shell
          $link = $sh.CreateShortcut($file)
          if ($link.TargetPath -ne $exe -or $link.Arguments -notlike '*--db*') { throw 'Bad W5 shortcut target' }
          # W7 read-only link verifier must distinguish valid vs missing/mismatched,
          # and must NOT claim that actual Windows login has launched the program.
          $verify = (& .\windows\manage_desktop_startup.ps1 -Verify -Executable $exe -DbPath $db -TestStartupDir $dir) | ConvertFrom-Json
          if (-not $verify.valid_link -or -not $verify.project_owned -or $verify.actual_login_autorun_verified -or $verify.changes_machine) {
            throw 'W7 startup read-only verification failed'
          }
          $refused = $false
          try {
            & .\windows\manage_desktop_startup.ps1 -Install -Executable $exe -DbPath $db -TestStartupDir $dir
          } catch { $refused = $true }
          if (-not $refused) { throw 'Existing shortcut overwrite was not blocked' }
          # Tamper ONLY the link in RUNNER_TEMP, retaining its project description.
          # An owned-looking link pointing to a different target must not be deleted.
          $link.TargetPath = Join-Path $env:RUNNER_TEMP 'w7-unexpected.exe'
          $link.Save()
          $bad = (& .\windows\manage_desktop_startup.ps1 -Verify -Executable $exe -DbPath $db -TestStartupDir $dir) | ConvertFrom-Json
          if ($bad.valid_link -or $bad.target_matches -or -not $bad.project_owned) {
            throw 'W7 tampered link incorrectly verified'
          }
          $blocked = $false
          try {
            & .\windows\manage_desktop_startup.ps1 -Remove -Executable $exe -DbPath $db -TestStartupDir $dir
          } catch { $blocked = $true }
          if (-not $blocked -or -not (Test-Path -LiteralPath $file)) {
            throw 'W7 failed to refuse deletion of unexpected target'
          }
          # Explicit repair is allowed only with ReplaceExisting.
          & .\windows\manage_desktop_startup.ps1 -Install -ReplaceExisting -Executable $exe -DbPath $db -TestStartupDir $dir
          $repaired = (& .\windows\manage_desktop_startup.ps1 -Verify -Executable $exe -DbPath $db -TestStartupDir $dir) | ConvertFrom-Json
          if (-not $repaired.valid_link) { throw 'W7 explicit repair failed' }
          & .\windows\manage_desktop_startup.ps1 -Remove -Executable $exe -DbPath $db -TestStartupDir $dir
          if (Test-Path -LiteralPath $file) { throw 'Startup rollback failed' }
          $gone = (& .\windows\manage_desktop_startup.ps1 -Verify -Executable $exe -DbPath $db -TestStartupDir $dir) | ConvertFrom-Json
          if ($gone.valid_link -or $gone.link_exists -or $gone.actual_login_autorun_verified) { throw 'W7 missing-link verification failed' }
          Write-Host 'W7_STARTUP_INTEGRITY_E2E_PASS: plan, install, verify, tamper block, explicit repair, removal, missing verification'
      - uses: actions/upload-artifact@v4
        with:
          name: W5-Windows-Unsigned-Desktop-EXE
          path: dist/EDUNotifications.exe
          if-no-files-found: error
          retention-days: 7


  w8-uat-package:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: W8 consent and synthetic-only regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH=Join-Path $PWD 'python'
          python -m unittest discover -s tests -p test_field_uat_launcher_w8.py -v
          if ($LASTEXITCODE -ne 0) { throw 'W8 launcher regressions failed' }
      - name: Package one-click standalone W8 UAT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install "pyinstaller>=6.12,<7"
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller not available' }
          & .\windows\build_field_uat.ps1 -Python 'python'
          $exe=Join-Path $PWD 'dist\EDUFieldUAT.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'W8 EXE not produced' }
          $report=Join-Path $env:RUNNER_TEMP 'w8-packaged-preflight.json'
          & $exe --preflight-file $report
          if ($LASTEXITCODE -ne 0) { throw 'W8 packaged preflight invocation failed' }
          for ($i=0; $i -lt 60 -and !(Test-Path -LiteralPath $report -PathType Leaf); $i++) {
            Start-Sleep -Milliseconds 250
          }
          if (!(Test-Path -LiteralPath $report -PathType Leaf)) { throw 'W8 preflight report missing' }
          $p=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($p.packaged_entrypoint -ne 'OK' -or -not $p.tk_importable -or
              -not $p.synthetic_only -or $p.changes_startup -or $p.opens_outlook -or
              $p.sends_smtp -or $p.actual_login_autorun_verified -or $p.production_accepted) {
            throw 'W8 packaged UAT violated safe preflight constraints'
          }
          Write-Host 'W8_PACKAGED_PREFLIGHT_PASS_NOT_PHYSICAL_UAT'
          # W19 packaged EXE read-only Win32 session diagnostic; NO GUI launch.
          $sessionFile=Join-Path $env:RUNNER_TEMP 'w19-packaged-session.json'
          if (Test-Path -LiteralPath $sessionFile) { throw 'Unexpected existing W19 session report' }
          & $exe --session-check-file $sessionFile
          if ($LASTEXITCODE -ne 0) { throw 'W19 numerical session diagnostic failed' }
          for ($i=0; $i -lt 60 -and !(Test-Path -LiteralPath $sessionFile -PathType Leaf); $i++) {
            Start-Sleep -Milliseconds 250
          }
          if (!(Test-Path -LiteralPath $sessionFile -PathType Leaf)) {
            throw 'W19 packaged EXE session diagnostic did not write evidence'
          }
          $s=Get-Content -LiteralPath $sessionFile -Raw | ConvertFrom-Json
          if (-not $s.live_windows_api_observed -or $s.human_interaction_observed -or
              $s.production_accepted -or $s.actual_login_autorun_verified -or
              $s.modifies_system -or $null -eq $s.process_session_id -or
              $s.status -notmatch '^W19_') {
            throw 'W19 packaged Windows numeric evidence violated no-GUI boundary'
          }
          if ($s.process_session_id -eq 0 -and $s.active_console_match) {
            throw 'W19 Session 0 was falsely reported as active console'
          }
          Write-Host 'W19_PACKAGED_WIN32_SESSION_READONLY_PASS_NOT_HUMAN_GUI_UAT'
          # W22A: execute the actual one-file EXE with a synthetic report,
          # without opening the signed-in GUI or touching Windows Startup.
          python tests/w22a_packaged_review_smoke.py --exe $exe --root (Join-Path $env:RUNNER_TEMP 'w22a-real-exe-review')
          if ($LASTEXITCODE -ne 0) { throw 'W22A packaged no-GUI reviewer failed' }
          Write-Host "W8_UAT_SHA256=$((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash)"
      - name: W17 GUI operator handoff kit, SHA256 verification only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $PWD 'python'
          python -m unittest discover -s tests -p test_uat_review_w17.py -v
          if ($LASTEXITCODE -ne 0) { throw 'W17 report review safety tests failed' }
          $exe=Join-Path $PWD 'dist\EDUFieldUAT.exe'
          $folder=Join-Path $env:RUNNER_TEMP 'w17-handoff-kit'
          if (Test-Path -LiteralPath $folder) { throw 'W17 kit directory unexpectedly exists' }
          New-Item -ItemType Directory -Path $folder | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $folder 'EDUFieldUAT.exe')
          Copy-Item -LiteralPath (Join-Path $PWD 'windows\W17_README_JP.txt') -Destination $folder
          $hash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($hash -notmatch '^[0-9A-F]{64}$') { throw 'W17 invalid executable SHA256' }
          $template=Get-Content -LiteralPath (Join-Path $PWD 'windows\W17_START_UAT.cmd.in') -Raw -Encoding UTF8
          if ($template -notmatch '__EXPECTED_SHA256__') { throw 'W17 launcher template lacks immutable hash placeholder' }
          $launcher=Join-Path $folder '00_START_UAT.cmd'
          $template.Replace('__EXPECTED_SHA256__',$hash) | Set-Content -LiteralPath $launcher -Encoding Ascii
          $output = @(& $launcher --verify-only)
          $code = $LASTEXITCODE
          if ($code -ne 0 -or ($output -join '') -notmatch 'W17_KIT_HASH_VERIFIED_NO_GUI') {
            throw 'W17 safe hash-check-only entrypoint failed'
          }
          $tampered=Join-Path $env:RUNNER_TEMP 'w17-tampered-test'
          New-Item -ItemType Directory -Path $tampered | Out-Null
          Copy-Item -LiteralPath (Join-Path $folder 'EDUFieldUAT.exe') -Destination $tampered
          Copy-Item -LiteralPath $launcher -Destination $tampered
          Add-Content -LiteralPath (Join-Path $tampered 'EDUFieldUAT.exe') -Value 'INTENTIONAL_TEST_TAMPER'
          $bad = @(& (Join-Path $tampered '00_START_UAT.cmd') --verify-only)
          $badCode = $LASTEXITCODE
          if ($badCode -ne 2 -or ($bad -join '') -notmatch 'W17_HASH_MISSING_OR_MISMATCH_DO_NOT_RUN') {
            throw 'W17 tampered unsigned executable was not rejected'
          }
          $zip=Join-Path $PWD 'dist\W17_SignedIn_GUI_UAT_Kit.zip'
          if (Test-Path -LiteralPath $zip) { throw 'W17 output already exists' }
          Compress-Archive -Path (Join-Path $folder '*') -DestinationPath $zip
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'W17 handoff ZIP missing' }
          # W18 examines the actual compressed artifact, not only pre-ZIP copies.
          # This remains synthetic/no GUI; negative cases mutate temp ZIP copies only.
          python -m unittest discover -s tests -p test_kit_integrity_w18.py -v
          if ($LASTEXITCODE -ne 0) { throw 'W18 ZIP integrity regressions failed' }
          python tests/w18_kit_zip_smoke.py --zip $zip
          if ($LASTEXITCODE -ne 0) { throw 'W18 final ZIP integrity / tamper E2E failed' }
          Write-Host 'W17_PACKAGED_HASH_CHECK_AND_TAMPER_REJECTION_PASS_NOT_PHYSICAL_UAT'
          Write-Host "W17_BUNDLE_SHA256=$((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash)"
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: W17-Windows-SignedIn-Unsigned-Synthetic-GUI-UAT-Kit
          path: dist/W17_SignedIn_GUI_UAT_Kit.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: W8-Windows-Unsigned-OneClick-Synthetic-UAT
          path: dist/EDUFieldUAT.exe
          if-no-files-found: error
          retention-days: 7
