name: W5 Windows Desktop Package & User-Session Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-package:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: W5 Tk controller regression and user-session protection
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONPATH = Join-Path $PWD 'python'
          python -m unittest discover -s tests -p test_ui_w5.py -v
          if ($LASTEXITCODE -ne 0) { throw 'W5 UI-controller regressions failed' }
          python -m unittest discover -s tests -p test_desktop_w4.py -v
          if ($LASTEXITCODE -ne 0) { throw 'W4 notification regressions failed' }
      - name: W5B real Windows Tk widget E2E with synthetic SQLite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $PWD 'python'
          $report = Join-Path $env:RUNNER_TEMP 'w5b-windows-tk-e2e.json'
          python tests/w5_windows_tk_widget_e2e.py --report $report
          if ($LASTEXITCODE -ne 0) { throw 'W5B real Windows Tk widgets E2E failed' }
          if (!(Test-Path -LiteralPath $report)) { throw 'W5B GUI evidence missing' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'PASS_WINDOWS_TK_WIDGET_E2E' -or
              -not $result.gui_window_mapped -or $result.approvals -ne 0 -or
              $result.initial_bell_calls -ne 1 -or
              -not $result.snooze_expiry_realerted -or
              -not $result.realert_only_once) {
            throw 'W5B Windows GUI E2E did not actually pass'
          }
          Write-Host "W5B_WINDOWS_TK_E2E_PASS session=$($result.windows_session_id)"
      - uses: actions/upload-artifact@v4
        with:
          name: W5B-Windows-Tk-Synthetic-Proof
          path: ${{ runner.temp }}/w5b-windows-tk-e2e.json
          if-no-files-found: error
          retention-days: 7
      - name: Package self-contained Windows desktop app
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install "pyinstaller>=6.12,<7"
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller dependency setup failed' }
          & .\windows\build_desktop.ps1 -Python 'python'
          # PowerShell scripts throw on failure; $LASTEXITCODE only tracks native programs.
          # Validate generated binary below instead of trusting a stale exit code.
          $exe = Join-Path $PWD 'dist\EDUNotifications.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Desktop EXE missing' }
          $preflight = Join-Path $env:RUNNER_TEMP 'w5-bundle-smoke.json'
          & $exe --db (Join-Path $env:RUNNER_TEMP 'w5-synthetic.sqlite3') --preflight-file $preflight
          if ($LASTEXITCODE -ne 0) { throw 'Portable Windows EXE preflight failed' }
          # A --windowed EXE can return before its GUI subprocess flushes its file.
          # Poll only this synthetic preflight path; never inspect the user's desktop.
          for ($i=0; $i -lt 40 -and !(Test-Path -LiteralPath $preflight -PathType Leaf); $i++) {
            Start-Sleep -Milliseconds 250
          }
          if (!(Test-Path -LiteralPath $preflight -PathType Leaf)) { throw 'Windowed EXE did not write smoke proof within 10 seconds' }
          $p=Get-Content -LiteralPath $preflight -Raw | ConvertFrom-Json
          if ($p.packaged_entrypoint -ne 'OK' -or -not $p.tk_importable) {
            throw 'The one-file EXE cannot import Tkinter'
          }
          Write-Host "W5_WINDOWS_EXE_SHA256=$((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash)"
      - name: Test safe Startup-folder preview, isolated install, rollback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe = Join-Path $PWD 'dist\EDUNotifications.exe'
          $db = Join-Path $env:RUNNER_TEMP 'w5-placeholder.sqlite3'
          $dir = Join-Path $env:RUNNER_TEMP 'w5-startup-sandbox'
          New-Item -ItemType File -Force -Path $db | Out-Null
          $p = (& .\windows\manage_desktop_startup.ps1 -PlanOnly -Executable $exe -DbPath $db -TestStartupDir $dir) | ConvertFrom-Json
          if ($p.action -ne 'preview' -or $p.modifies_registry -or $p.modifies_task_scheduler -or $p.requires_admin) {
            throw 'Unsafe or incorrect startup preview'
          }
          & .\windows\manage_desktop_startup.ps1 -Install -Executable $exe -DbPath $db -TestStartupDir $dir
          # No $LASTEXITCODE here: install is a PowerShell script and throws on failure.
          # Verify the created link and its target instead.
          $file = Join-Path $dir 'EDU_Workflow_Notifications.lnk'
          if (!(Test-Path -LiteralPath $file)) { throw 'Expected W5 shortcut missing' }
          $sh = New-Object -ComObject WScript.Shell
          $link = $sh.CreateShortcut($file)
          if ($link.TargetPath -ne $exe -or $link.Arguments -notlike '*--db*') { throw 'Bad W5 shortcut target' }
          $refused = $false
          try {
            & .\windows\manage_desktop_startup.ps1 -Install -Executable $exe -DbPath $db -TestStartupDir $dir
          } catch { $refused = $true }
          if (-not $refused) { throw 'Existing shortcut overwrite was not blocked' }
          & .\windows\manage_desktop_startup.ps1 -Remove -Executable $exe -DbPath $db -TestStartupDir $dir
          if (Test-Path -LiteralPath $file) { throw 'Startup rollback failed' }
          Write-Host 'W5_STARTUP_E2E_PASS: plan-only, isolated install, overwrite refusal, removal'
      - uses: actions/upload-artifact@v4
        with:
          name: W5-Windows-Unsigned-Desktop-EXE
          path: dist/EDUNotifications.exe
          if-no-files-found: error
          retention-days: 7
